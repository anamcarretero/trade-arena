name: tradearena

x-api-base: &api-base
  image: ${TRADEARENA_IMAGE:-tradearena:local}
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-tradearena}:${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradearena}
    AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Define el dominio EU del tenant Auth0}
    AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?Define el client ID de Auth0}
    BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?Genera un secreto compartido API-BFF}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tradearena}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api-base
    command: ["python", "-m", "tradearena", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-base
    build:
      context: .
    ports:
      - "${TRADEARENA_BIND_ADDRESS:-127.0.0.1}:${TRADEARENA_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ${TRADEARENA_WEB_IMAGE:-tradearena-web:local}
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Define el dominio EU del tenant Auth0}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?Define el client ID de Auth0}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:?Define el client secret de Auth0}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      API_BASE_URL: http://api:8080
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?Genera un secreto compartido API-BFF}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?Genera una clave base64url de 32 bytes}
    ports:
      - "${TRADEARENA_WEB_BIND_ADDRESS:-127.0.0.1}:${TRADEARENA_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
