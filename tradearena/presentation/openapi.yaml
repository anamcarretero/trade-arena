openapi: 3.1.0
info:
  title: TradeArena API
  version: 1.0.0
security:
  - bearerSession: []
paths:
  /health/live:
    get:
      operationId: healthLive
      security: []
      responses:
        "200": {description: Proceso ASGI operativo}
  /health/ready:
    get:
      operationId: healthReady
      security: []
      responses:
        "200": {description: Dependencias disponibles}
        "503": {description: Alguna dependencia no está disponible}
  /api/v1/auth/session:
    post:
      operationId: exchangeAuth0Session
      description: Uso exclusivo del BFF; valida un ID token Auth0 y emite una sesión opaca.
      security:
        - internalBff: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token, nonce]
              properties:
                id_token: {type: string, minLength: 1, writeOnly: true}
                nonce: {type: string, minLength: 16, writeOnly: true}
      responses:
        "201":
          description: Sesión propia emitida al BFF
          content:
            application/json:
              schema:
                type: object
                required: [session_token, expires_in]
                properties:
                  session_token: {type: string, writeOnly: true}
                  expires_in: {type: integer, minimum: 1}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/auth/logout:
    post:
      operationId: revokeOwnSession
      responses:
        "204": {description: Sesión revocada}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/me:
    get:
      operationId: exportOwnAccount
      responses:
        "200":
          description: Exportación completa y reproducible de datos propios, sin sesiones ni credenciales
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountExport"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      operationId: deleteOwnAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm_account_deletion]
              properties:
                confirm_account_deletion: {type: boolean, const: true}
      responses:
        "204": {description: Cuenta eliminada}
        "400": {description: Falta confirmación explícita}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/notifications:
    get:
      operationId: listOwnNotifications
      responses:
        "200":
          description: Notificaciones privadas de la sesión, nuevas primero
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Notification"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/notifications/{notification_id}/read:
    post:
      operationId: markOwnNotificationRead
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Notificación propia marcada como leída de forma idempotente
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Notification"}
        "404": {description: Notificación inexistente o ajena}
  /api/v1/me/profile:
    patch:
      operationId: updateOwnProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, locale, birth_date, accepted_terms_at]
              properties:
                display_name: {type: string, minLength: 1}
                locale: {type: string, enum: [es, en]}
                birth_date: {type: string, format: date}
                accepted_terms_at: {type: string, format: date-time}
      responses:
        "200": {description: Perfil actualizado}
        "400": {description: Perfil o política de edad inválidos}
  /api/v1/leagues:
    get:
      operationId: listOwnLeagues
      responses:
        "200":
          description: Ligas de las que forma parte la sesión
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LeagueDetail"}
    post:
      operationId: createLeague
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: {name: {type: string, minLength: 1}}
      responses:
        "201":
          description: Liga creada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LeagueDetail"}
        "409": {description: Límite del plan alcanzado}
  /api/v1/invitations:
    get:
      operationId: listOwnInvitations
      responses:
        "200":
          description: Invitaciones pendientes ligadas al email de la sesión
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/OwnInvitation"}
  /api/v1/leagues/{league_id}:
    get:
      operationId: getLeague
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
      responses:
        "200":
          description: Liga autorizada con miembros e invitaciones visibles por rol
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LeagueDetail"}
        "404": {description: No existe o la sesión no pertenece a ella}
  /api/v1/leagues/{league_id}/competitions:
    get:
      operationId: listLeagueCompetitions
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
      responses:
        "200":
          description: Competiciones de una liga accesible para la sesión
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Competition"}
        "404": {description: Liga no accesible}
    post:
      operationId: createCompetition
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompetitionInput"}
      responses:
        "201":
          description: Borrador de competición creado por propietario o administrador
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Competition"}
        "400": {description: Calendario inválido}
        "404": {description: Liga no accesible}
  /api/v1/leagues/{league_id}/competitions/{competition_id}:
    get:
      operationId: getCompetition
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
        - {$ref: "#/components/parameters/CompetitionId"}
      responses:
        "200":
          description: Competición de una liga accesible para la sesión
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Competition"}
        "404": {description: Liga o competición no accesible}
  /api/v1/leagues/{league_id}/competitions/{competition_id}/start:
    post:
      operationId: startCompetition
      description: Fija de forma inmutable el calendario y las reglas vigentes.
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
        - {$ref: "#/components/parameters/CompetitionId"}
      responses:
        "200":
          description: Competición iniciada con rules_snapshot inmutable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Competition"}
        "404": {description: Liga o competición no accesible}
        "409": {description: La competición ya estaba iniciada}
  /api/v1/leagues/{league_id}/competitions/{competition_id}/portfolio:
    get:
      operationId: getOwnCompetitionPortfolio
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
        - {$ref: "#/components/parameters/CompetitionId"}
      responses:
        "200":
          description: Cartera propia, posiciones e historial financiero
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Portfolio"}
        "404": {description: Liga, competición o cartera no accesible}
  /api/v1/leagues/{league_id}/competitions/{competition_id}/orders:
    post:
      operationId: submitCompetitionOrder
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
        - {$ref: "#/components/parameters/CompetitionId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrderInput"}
      responses:
        "201":
          description: Orden aceptada y cartera resultante
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Portfolio"}
        "400": {description: Orden inválida}
        "404": {description: Liga, competición o cartera no accesible}
        "409": {description: Fuera de calendario o clave idempotente en conflicto}
  /api/v1/leagues/{league_id}/competitions/{competition_id}/reported-trades:
    post:
      operationId: reportCompetitionTrade
      description: Registra una ejecución simulada ya realizada; no envía una orden al mercado.
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
        - {$ref: "#/components/parameters/CompetitionId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReportedTradeInput"}
      responses:
        "201":
          description: Operación declarada registrada atómicamente y cartera resultante
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Portfolio"}
        "400": {description: Campos, precisión, USD/FX, total o comisión inválidos}
        "404": {description: Liga, competición o cartera no accesible}
        "409": {description: Fecha, cronología, saldo, posición o idempotencia en conflicto}
  /api/v1/leagues/{league_id}/competitions/{competition_id}/reported-trades/{execution_id}/corrections:
    post:
      operationId: correctReportedCompetitionTrade
      description: Crea un movimiento compensatorio auditable; nunca modifica ni borra la ejecución original.
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
        - {$ref: "#/components/parameters/CompetitionId"}
        - name: execution_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReportedTradeCorrectionInput"}
      responses:
        "201":
          description: Movimiento compensatorio creado y cartera resultante
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Portfolio"}
        "404": {description: Liga, competición, cartera u operación no accesible}
        "409": {description: Corrección duplicada, fecha, saldo o posición incompatibles}
  /api/v1/leagues/{league_id}/competitions/{competition_id}/orders/{order_id}:
    delete:
      operationId: cancelCompetitionOrder
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
        - {$ref: "#/components/parameters/CompetitionId"}
        - name: order_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Orden pendiente cancelada y cartera resultante
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Portfolio"}
        "404": {description: Liga, competición, cartera u orden no accesible}
        "409": {description: La orden ya no está pendiente}
  /api/v1/leagues/{league_id}/competitions/{competition_id}/ranking:
    get:
      operationId: getCompetitionRanking
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
        - {$ref: "#/components/parameters/CompetitionId"}
      responses:
        "200":
          description: Ranking porcentual reproducible de participantes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ranking"}
        "404": {description: Liga o competición no accesible}
  /api/v1/leagues/{league_id}/invitations:
    post:
      operationId: inviteLeagueMember
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        "201":
          description: Enlace de invitación creado; caduca a los siete días
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedInvitation"}
        "404": {description: Liga no accesible}
        "409": {description: Límite del plan alcanzado}
  /api/v1/leagues/{league_id}/invitations/{invitation_id}:
    delete:
      operationId: revokeLeagueInvitation
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
        - name: invitation_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "204": {description: Invitación revocada}
        "404": {description: Liga o invitación no accesible}
  /api/v1/invitations/{invitation_id}:
    post:
      operationId: acceptInvitation
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Membresía creada}
        "404": {description: Invitación no utilizable por esta sesión}
  /api/v1/leagues/{league_id}/members/{user_id}:
    delete:
      operationId: removeLeagueMember
      parameters:
        - {$ref: "#/components/parameters/LeagueId"}
        - name: user_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "204": {description: Miembro expulsado conservando historial}
        "404": {description: Liga no accesible}
components:
  schemas:
    AccountExport:
      type: object
      required: [schema_version, user, profile, memberships, invitations, notifications, financial_history, audit]
      properties:
        schema_version: {type: string, const: "1"}
        user: {type: object, additionalProperties: true}
        profile: {oneOf: [{type: object, additionalProperties: true}, {type: "null"}]}
        memberships: {type: array, items: {type: object, additionalProperties: true}}
        invitations: {type: array, items: {type: object, additionalProperties: true}}
        notifications: {type: array, items: {$ref: "#/components/schemas/Notification"}}
        financial_history: {type: array, items: {type: object, additionalProperties: true}}
        audit: {type: array, items: {type: object, additionalProperties: true}}
    Notification:
      type: object
      additionalProperties: false
      required: [id, kind, payload, created_at, read_at]
      properties:
        id: {type: string}
        kind: {type: string}
        payload: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
        read_at: {oneOf: [{type: string, format: date-time}, {type: "null"}]}
    Role:
      type: string
      enum: [owner, admin, member]
    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked, expired]
    LeagueMember:
      type: object
      required: [user_id, display_name, role, joined_at]
      properties:
        user_id: {type: string}
        display_name: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        joined_at: {type: string, format: date-time}
    LeagueInvitation:
      type: object
      required: [id, email, role, expires_at, status]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        role: {$ref: "#/components/schemas/Role"}
        expires_at: {type: string, format: date-time}
        status: {$ref: "#/components/schemas/InvitationStatus"}
    LeagueDetail:
      type: object
      required: [id, name, owner_id, created_at, active, plan, actor_role, max_members, members, invitations]
      properties:
        id: {type: string}
        name: {type: string}
        owner_id: {type: string}
        created_at: {type: string, format: date-time}
        active: {type: boolean}
        plan: {type: string, enum: [free]}
        actor_role: {$ref: "#/components/schemas/Role"}
        max_members: {type: integer, minimum: 1}
        members:
          type: array
          items: {$ref: "#/components/schemas/LeagueMember"}
        invitations:
          type: array
          description: Solo se devuelve a propietario o administrador.
          items: {$ref: "#/components/schemas/LeagueInvitation"}
    OwnInvitation:
      type: object
      required: [id, league_id, league_name, expires_at]
      properties:
        id: {type: string}
        league_id: {type: string}
        league_name: {type: string}
        expires_at: {type: string, format: date-time}
    CreatedInvitation:
      type: object
      required: [id, email, expires_at, status]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        expires_at: {type: string, format: date-time}
        status: {$ref: "#/components/schemas/InvitationStatus"}
    CompetitionInput:
      type: object
      required: [name, starts_at, ends_at]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
    CompetitionStatus:
      type: string
      enum: [draft, active, finished]
    RulesSnapshot:
      type: object
      description: Copia inmutable del calendario y reglas vigentes al iniciar.
      required: [version, calendar, rules]
      properties:
        version: {type: string}
        calendar:
          type: object
          required: [market, timezone, starts_at, ends_at]
          properties:
            market: {type: string}
            timezone: {type: string}
            starts_at: {type: string, format: date-time}
            ends_at: {type: string, format: date-time}
        rules:
          type: object
          required: [currency, initial_capital]
          properties:
            currency: {type: string, enum: [USD]}
            initial_capital: {type: string, pattern: '^3000\\.00$'}
          additionalProperties: true
    Competition:
      type: object
      required: [id, league_id, name, starts_at, ends_at, status, rules_snapshot, started_at]
      properties:
        id: {type: string}
        league_id: {type: string}
        name: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        status: {$ref: "#/components/schemas/CompetitionStatus"}
        rules_snapshot:
          oneOf:
            - {$ref: "#/components/schemas/RulesSnapshot"}
            - {type: "null"}
        started_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
    OrderInput:
      type: object
      additionalProperties: false
      required: [symbol, side, quantity, order_type, allow_extended_hours]
      properties:
        symbol: {type: string, pattern: '^[A-Za-z][A-Za-z0-9.\-]*$', maxLength: 16}
        side: {type: string, enum: [buy, sell]}
        quantity: {type: string, pattern: '^\d+(?:\.\d{1,8})?$'}
        order_type: {type: string, enum: [market, limit]}
        allow_extended_hours: {type: boolean}
        limit_price:
          oneOf: [{type: string, pattern: '^\d+(\.\d{1,4})?$'}, {type: "null"}]
        commission:
          description: Comisión elegida por el usuario; si se omite se aplica la comisión fijada en rules_snapshot al ejecutarse.
          oneOf: [{type: string, pattern: '^\d+(?:[.,]\d{1,2})?$'}, {type: "null"}]
        client_order_id:
          oneOf: [{type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9-]+$'}, {type: "null"}]
    Order:
      type: object
      required: [id, symbol, side, quantity, order_type, allow_extended_hours, limit_price, status, rejection_reason, submitted_at, commission]
      properties:
        id: {type: string}
        symbol: {type: string}
        side: {type: string, enum: [buy, sell]}
        quantity: {type: string, pattern: '^\d+(?:\.\d{1,8})?$'}
        order_type: {type: string, enum: [market, limit]}
        allow_extended_hours: {type: boolean}
        limit_price: {oneOf: [{type: string}, {type: "null"}]}
        status: {type: string, enum: [pending, filled, rejected, cancelled]}
        rejection_reason: {oneOf: [{type: string}, {type: "null"}]}
        submitted_at: {type: string, format: date-time}
        commission: {oneOf: [{type: string}, {type: "null"}]}
    Execution:
      type: object
      required: [id, order_id, symbol, side, quantity, price, commission, session, executed_at, source, total_amount, currency, fx_rate, correction_of]
      properties:
        id: {type: string}
        order_id: {type: string}
        symbol: {type: string}
        side: {type: string, enum: [buy, sell]}
        quantity: {type: string, pattern: '^\d+(?:\.\d{1,8})?$'}
        price: {type: string}
        commission: {type: string}
        session: {type: string, enum: [regular, extended]}
        executed_at: {type: string, format: date-time}
        source: {type: string, enum: [fixture, reported]}
        total_amount: {oneOf: [{type: string}, {type: "null"}]}
        currency: {type: string, enum: [USD]}
        fx_rate: {type: string}
        correction_of: {oneOf: [{type: string}, {type: "null"}]}
    Position:
      type: object
      required: [symbol, quantity, price, market_value]
      properties:
        symbol: {type: string}
        quantity: {type: string, pattern: '^\d+(?:\.\d{1,8})?$'}
        price: {oneOf: [{type: string}, {type: "null"}]}
        market_value: {oneOf: [{type: string}, {type: "null"}]}
    Portfolio:
      type: object
      required: [id, competition_id, user_id, currency, initial_cash, cash, joined_at, joined_late, positions, orders, executions, equity, cumulative_return]
      properties:
        id: {type: string}
        competition_id: {type: string}
        user_id: {type: string}
        currency: {type: string, enum: [USD]}
        initial_cash: {type: string}
        cash: {type: string}
        joined_at: {type: string, format: date-time}
        joined_late: {type: boolean}
        positions: {type: array, items: {$ref: "#/components/schemas/Position"}}
        orders: {type: array, items: {$ref: "#/components/schemas/Order"}}
        executions: {type: array, items: {$ref: "#/components/schemas/Execution"}}
        equity: {type: string}
        cumulative_return: {type: string}
    ReportedTradeInput:
      type: object
      additionalProperties: false
      required: [date, ticker, type, quantity, price_per_share, total_amount, currency, fx_rate, client_trade_id]
      properties:
        date:
          type: string
          description: Fecha y hora local; si no incluye offset se interpreta con timezone.
        timezone: {type: string, enum: [Europe/Madrid, UTC], default: Europe/Madrid}
        ticker: {type: string, pattern: '^[A-Za-z][A-Za-z0-9.\-]*$', maxLength: 16}
        type: {type: string, enum: [buy, sell]}
        quantity: {type: string, pattern: '^\d+(?:\.\d{1,8})?$'}
        price_per_share: {type: string, pattern: '^\d+(?:[.,]\d{1,4})?$'}
        total_amount: {type: string, pattern: '^\d+(?:[.,]\d{1,2})?$'}
        commission:
          description: Opcional; si se omite se infiere del precio, cantidad, tipo e importe total.
          oneOf: [{type: string, pattern: '^\d+(?:[.,]\d{1,2})?$'}, {type: "null"}]
        currency: {type: string, enum: [USD]}
        fx_rate: {type: string, pattern: '^1(?:\.0{1,8})?$'}
        client_trade_id: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9-]+$'}
    ReportedTradeCorrectionInput:
      type: object
      additionalProperties: false
      required: [date, client_trade_id]
      properties:
        date: {type: string, format: date-time}
        client_trade_id: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9-]+$'}
    RankingRow:
      type: object
      required: [rank, user_id, portfolio_id, display_name, cumulative_return, joined_late]
      properties:
        rank: {type: integer, minimum: 1}
        user_id: {type: string}
        portfolio_id: {type: string}
        display_name: {type: string}
        cumulative_return: {type: string}
        joined_late: {type: boolean}
    Ranking:
      type: object
      required: [competition_id, as_of, rows, digest]
      properties:
        competition_id: {type: string}
        as_of: {type: string, format: date-time}
        rows: {type: array, items: {$ref: "#/components/schemas/RankingRow"}}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
    internalBff:
      type: apiKey
      in: header
      name: X-TradeArena-BFF
  parameters:
    LeagueId:
      name: league_id
      in: path
      required: true
      schema: {type: string}
    CompetitionId:
      name: competition_id
      in: path
      required: true
      schema: {type: string}
  responses:
    Forbidden:
