name: Integración Neon efímera

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tradearena/**"
      - "migrations/**"
      - "tests/tradearena/**"
      - "requirements*.txt"
      - "requirements.in"
      - "Dockerfile"
      - ".github/workflows/neon-pr.yml"

permissions:
  contents: read

concurrency:
  group: neon-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integration:
    if: vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Caducidad automática de seguridad
        run: echo "NEON_EXPIRES_AT=$(date -u --date '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Crear rama Neon aislada
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          expires_at: ${{ env.NEON_EXPIRES_AT }}
          suspend_timeout: 300
      - name: Migraciones e integración en Neon
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          TEST_DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          python -m tradearena migrate
          python scripts/verify-migrations.py
          python -m pytest tests/tradearena -q
      - name: Eliminar rama Neon
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
