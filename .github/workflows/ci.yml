name: Verificación de pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradearena
          POSTGRES_PASSWORD: tradearena
          POSTGRES_DB: tradearena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradearena -d tradearena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tradearena:tradearena@127.0.0.1:5432/tradearena_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: Instalar dependencias Python 3.12
        run: python -m pip install --requirement requirements.txt
      - name: Migrar esquema vacío y versión anterior
        run: python scripts/verify-migrations.py
      - name: Ejecutar pruebas Python
        run: python -m pytest tests/ -q
      - name: Ensayar runbooks de backup y restauración aislada
        env:
          DATABASE_URL: postgresql://tradearena:tradearena@127.0.0.1:5432/tradearena_test
          RESTORE_DATABASE_URL: postgresql://tradearena:tradearena@127.0.0.1:5432/tradearena_restore_test
        run: |
          python -m tradearena migrate
          ./scripts/staging/backup.sh /tmp/tradearena-ci.dump
          createdb --maintenance-db="$DATABASE_URL" tradearena_restore_test
          ./scripts/staging/restore-drill.sh /tmp/tradearena-ci.dump --confirm-isolated
      - name: Reproducir ranking histórico offline
        shell: bash
        run: |
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          python -m trader ranking \
            --players-dir examples/players \
            --prices-dir examples/prices \
            --analysts-dir "$output_dir/analysts" \
            --public-dir "$output_dir/public" \
            --badges-file "$output_dir/badges.json" \
            --out "$output_dir/ranking.md" \
            --html-out "$output_dir/index.html" \
            --pending-out "$output_dir/pending.json" \
            --offline

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SESSION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AUTH0_DOMAIN: ci.eu.auth0.com
      AUTH0_CLIENT_ID: ci-client
      AUTH0_CLIENT_SECRET: ci-secret
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8080
      BFF_SHARED_SECRET: ci-shared-secret
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Instalar dependencias PWA
        run: pnpm install --frozen-lockfile
      - name: Comprobar cliente OpenAPI generado
        run: |
          pnpm generate:api
          git diff --exit-code -- src/lib/api-schema.d.ts
      - name: Lint, tipos y unitarias
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Build de producción
        run: pnpm build
      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright E2E y axe WCAG
        run: pnpm test:e2e

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - name: Formato y validación Terraform sin backend ni credenciales
        run: |
          terraform -chdir=infra/staging fmt -check -recursive
          terraform -chdir=infra/staging init -backend=false
          terraform -chdir=infra/staging validate
      - name: Sintaxis y mínimo privilegio
        run: |
          python scripts/validate-delivery.py
          bash -n scripts/*.sh scripts/staging/*.sh
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
          docker run --rm --entrypoint shellcheck -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:v0.10.0 \
            scripts/*.sh scripts/staging/*.sh
      - name: Validar Dockerfiles y Compose
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-url-safe-secret/ci-only-not-a-real-secret/' .env
          sed -i 's/replace.eu.auth0.com/ci.eu.auth0.com/' .env
          sed -i 's/replace-with-auth0-client-id/ci-client/' .env
          sed -i 's/replace-with-auth0-client-secret/ci-secret/' .env
          sed -i 's/replace-with-an-independent-32-byte-secret/ci-shared-secret/' .env
          sed -i 's/replace-with-32-base64url-bytes/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/' .env
          docker compose --env-file .env config --quiet
          docker build --check --file Dockerfile .
          docker build --check --file Dockerfile.web .
          docker run --rm -i hadolint/hadolint:v2.12.0-alpine < Dockerfile
          docker run --rm -i hadolint/hadolint:v2.12.0-alpine < Dockerfile.web

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir, migrar y verificar Compose desde cero
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-url-safe-secret/ci-only-not-a-real-secret/' .env
          sed -i 's/replace.eu.auth0.com/ci.eu.auth0.com/' .env
          sed -i 's/replace-with-auth0-client-id/ci-client/' .env
          sed -i 's/replace-with-auth0-client-secret/ci-secret/' .env
          sed -i 's/replace-with-an-independent-32-byte-secret/ci-shared-secret/' .env
          sed -i 's/replace-with-32-base64url-bytes/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/' .env
          trap 'docker compose down --volumes' EXIT
          ./scripts/install-compose.sh
