name: Verificación de pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SESSION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AUTH0_DOMAIN: ci.eu.auth0.com
      AUTH0_CLIENT_ID: ci-client
      AUTH0_CLIENT_SECRET: ci-secret
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8080
      BFF_SHARED_SECRET: ci-shared-secret
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Instalar dependencias PWA
        run: pnpm install --frozen-lockfile
      - name: Verificar cliente OpenAPI y PWA
        run: |
          pnpm generate:api
          git diff --exit-code -- src/lib/api-schema.d.ts
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradearena
          POSTGRES_PASSWORD: tradearena
          POSTGRES_DB: tradearena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradearena -d tradearena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tradearena:tradearena@127.0.0.1:5432/tradearena_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m pytest tests/ -q

      - name: Validar instalación reproducible
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-url-safe-secret/ci-only-not-a-real-secret/' .env
          sed -i 's/replace.eu.auth0.com/ci.eu.auth0.com/' .env
          sed -i 's/replace-with-auth0-client-id/ci-client/' .env
          sed -i 's/replace-with-auth0-client-secret/ci-secret/' .env
          sed -i 's/replace-with-an-independent-32-byte-secret/ci-shared-secret/' .env
          sed -i 's/replace-with-32-base64url-bytes/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/' .env
          trap 'docker compose down --volumes' EXIT
          bash -n scripts/install-compose.sh scripts/verify-deployment.sh
          ./scripts/install-compose.sh

      - name: Validar ranking histórico offline
        shell: bash
        run: |
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          python -m trader ranking \
            --players-dir examples/players \
            --prices-dir examples/prices \
            --analysts-dir "$output_dir/analysts" \
            --public-dir "$output_dir/public" \
            --badges-file "$output_dir/badges.json" \
            --out "$output_dir/ranking.md" \
            --html-out "$output_dir/index.html" \
            --pending-out "$output_dir/pending.json" \
            --offline
